<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="온새미 수학학원 운영 화면 체험">
  <title>온새미 수학학원 · 운영 체험</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/qr-vendor.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body data-demo="generic">
  <a class="skip" href="#content">본문으로 이동</a>
  <div class="proposal-banner general-banner">가상 학원 운영 체험</div>
  <div class="shell">
    <aside class="rail" aria-label="학원 메뉴">
      <div class="brand">
        <span class="monogram" aria-hidden="true">온</span>
        <div><strong>온새미</strong><span>수학학원</span></div>
      </div>
      <nav class="navigation" id="navigation" aria-label="화면 선택"></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="school"><strong>온새미 수학학원</strong></div>
        <div class="top-actions">
          <label for="role" class="sr-only">체험 역할</label>
          <select id="role">
            <option value="owner">원장 체험</option>
            <option value="teacher">선생님 체험</option>
            <option value="student">학생 체험</option>
            <option value="parent">보호자 체험</option>
          </select>
          <button id="reset" class="ghost" type="button">초기화</button>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <footer>변경 사항은 이 브라우저에만 저장됩니다.</footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="feedback" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>데모 화면을 보려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
